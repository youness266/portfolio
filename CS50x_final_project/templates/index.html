<!DOCTYPE html>
<html lang = "en">
    <head>
    <meta charset = "UTF-8">
    <title>{{ title }}</title>
    <link  rel = "stylesheet" href = '{{ url_for("static",filename = "style.css")}}' >
    </head>
    <body>
        <div class = "container">
            <h1>🔒 Image Locker</h1>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <p>Protect Your Images</p>
            <!-- Upload Form -->
             <form action = "/encrypt" method = "post" enctype = "multipart/form-data">
                <div class = "mb-3">
                    <label for = "encrypt-image">Select an image</label>
                    <input type = "file" id = "encrypt-image" name = "image" accept = "image/*" required>
                </div>
                <div class = "mb-3">
                    <label for = "encrypt-key" >Select an encryption key: </label>
                    <input type = "number" id = "encrypt-key" name = "key" placeholder = "Enter a Number" required>
                    <label for = "confirmation" >Confirm encryption key: </label>
                    <input type = "number" id = "confirmation" name = "confirmation" placeholder = "Enter a Number" required>
                </div>
                <button type = "submit">Encrypt</button>
            </form>
            <!-- Decryption Form -->
             <form action = "/decrypt" method = "post" enctype = "multipart/form-data" style = "margin-top:20px;">
                <div class = "mb-3">
                    <label for = "decrypt-image">Upload Encrypted image</label>
                    <input type = "file" id = "decrypt-image" name = "image" accept = "image/*" required>
                </div>
                <div class = "mb-3">
                    <label for = "decrypt-key" >Enter decryption key: </label>
                    <input type = "number" id = "decrypt-key" name = "key" placeholder = "Enter a Number" required>
                    <label for = "confirmation" >Confirm decryption key: </label>
                    <input type = "number" id = "confirmation" name = "confirmation" placeholder = "Enter a Number" required>
                </div>
                <button type = "submit">Decrypt</button>
            </form>
        </div>
    </body>
</html>
