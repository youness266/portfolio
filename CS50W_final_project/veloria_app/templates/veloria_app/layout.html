{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Veloria{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'veloria_app/style.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body class="bg-gray-900 text-white">
  <header class="fixed top-0 w-full bg-black bg-opacity-40 p-4 flex justify-between items-center z-50">
    <h1 class="text-3xl font-bold">Veloria</h1>
    <nav>
      <a href="{% url 'index' %}" class="mx-2 hover:text-blue-400">
        <i class="bi bi-house"></i> 
        Home
      </a>
      <a href="{% url 'stories' %}" class="mx-2 hover:text-blue-400">
        <i class="bi bi-book"></i> 
        Stories
      </a>
      {% if user.is_authenticated %}
        <a href="{% url 'vocabulary' %}" class="mx-2 hover:text-blue-400">
          <i class="bi bi-journal-text"></i> 
          Vocabulary
        </a>
        <a href="{% url 'logout' %}" class="mx-2 hover:text-blue-400">
          <i class="bi bi-box-arrow-right"></i> 
          Logout
        </a>
      {% else %}
        <a href="{% url 'login' %}" class="mx-2 hover:text-blue-400">
          <i class="bi bi-box-arrow-in-right"></i> 
          Login
        </a>
      {% endif %}
    </nav>
    <div class="flex items-center gap-2 bg-gray-800 bg-opacity-70 text-white px-3 py-2 rounded-lg shadow">
      <i class="bi bi-person-circle"></i>
      <span>{{ user.username }}</span>
    </div>
  </header>

  {% block content %}

  {% endblock %}

  <script src="{% static 'veloria_app/app.js' %}"></script>
</body>
</html>
